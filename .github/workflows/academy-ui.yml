name: Validate academy track and connected lessons
on:
  push:
    branches: ['codex/academy-track-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: academy-track-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check career model and shared UI
        run: node tests/academy-lessons.mjs && node tests/academy-drive.mjs && node tests/career.mjs && node tests/track-briefing.mjs && node tests/race-session.mjs
      - run: npm run build -- --base=/f1/
      - name: Check browser flows and responsive layouts
        shell: bash
        run: |
          set -eu
          npm run dev -- --port 5180 > /tmp/apex-vite.log 2>&1 &
          vite_pid=$!
          chrome_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$chrome_bin" --headless --no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --remote-debugging-port=9238 --user-data-dir=/tmp/apex-contract-browser about:blank > /tmp/apex-chrome.log 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:5180/ >/dev/null 2>&1 && curl -fsS http://127.0.0.1:9238/json/list >/dev/null 2>&1; then break; fi
            sleep 1
          done
          CAREER_UI_ONLY=1 node tests/career-browser.mjs
          node tests/academy-browser.mjs
      - name: Capture review previews
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          for(const name of ['academy-intro-1280','academy-intro-390','academy-exit-brake','academy-exit-steer','academy-exit-throttle','academy-track-1280']){
            const path='/tmp/apex-career-checks/'+name+'.png';
            if(fs.existsSync(path))console.log('UI_SCREENSHOT '+name+' '+fs.readFileSync(path).toString('base64'));
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academy-track-ui
          path: |
            /tmp/apex-career-checks/
            /tmp/apex-vite.log
            /tmp/apex-chrome.log
          if-no-files-found: ignore
