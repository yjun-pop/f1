name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Choose checks for changed files
        id: checks
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE_SHA" HEAD)
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -Ev '^(src/ui/(CircuitMenu\.(ts|css)|TitleScreen\.(ts|css)|Glass\.css|RacingTheme\.css|WheelSetup\.(ts|css)|Settings\.(ts|css)|CircuitBackdrop\.ts|BattleAwareness\.ts|HUD\.ts|RaceSessionPanel\.ts|LapTables\.ts|RaceTiming\.css)|src/game/(DrivingFeedback|DrivingVibration|WheelRumble)\.ts|src/main\.ts|src/style\.css|tests/(driving-vibration|wheel-rumble|battle-awareness|circuit-(menu|backdrop)|race-session|circuits)\.mjs|README\.md|\.github/workflows/pages\.yml)$' > /dev/null; then
              echo 'ui_only=true' >> "$GITHUB_OUTPUT"
            fi
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -Ev '^(src/game/(MonacoScenery|RegionalScenery|CircuitScenery|VenueArchitecture|NaturalScenery|RegionalWaters)\.ts|src/ui/CircuitBackdrop\.ts|tests/(regional-scenery|roadside-placement|monaco-scenery|venue-architecture)\.mjs|README\.md|docs/(MONACO_ENVIRONMENT|CIRCUIT_AUTHENTICITY|CIRCUIT_REFERENCES)\.md|\.github/workflows/pages\.yml)$' > /dev/null; then
              echo 'scenery_only=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Check menus and race UI
        if: steps.checks.outputs.ui_only == 'true' || steps.checks.outputs.scenery_only == 'true'
        run: node tests/battle-awareness.mjs && node tests/circuit-menu.mjs && node tests/circuit-backdrop.mjs && node tests/race-session.mjs && node tests/race-laps.mjs && node tests/wheel-rumble.mjs
      - name: Check scenery placement and rendering structure
        if: steps.checks.outputs.scenery_only == 'true'
        run: node tests/regional-scenery.mjs && node tests/roadside-placement.mjs && node tests/monaco-scenery.mjs && node tests/venue-architecture.mjs
      - name: Check racing and game systems
        if: steps.checks.outputs.ui_only != 'true' && steps.checks.outputs.scenery_only != 'true'
        run: npm test
      - name: Check account data access rules
        if: steps.checks.outputs.ui_only != 'true' && steps.checks.outputs.scenery_only != 'true'
        run: bash tests/account-database.sh
      - run: npm run build -- --base=/f1/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
