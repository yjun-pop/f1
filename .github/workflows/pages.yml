name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Choose checks for changed files
        id: checks
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE_SHA" HEAD)
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | rg -qv '^(src/ui/CircuitMenu\.(ts|css)|tests/circuit-menu\.mjs|README\.md|\.github/workflows/pages\.yml)$'; then
              echo 'ui_only=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Check title screen
        if: steps.checks.outputs.ui_only == 'true'
        run: node tests/circuit-menu.mjs
      - name: Check racing and game systems
        if: steps.checks.outputs.ui_only != 'true'
        run: npm test
      - run: npm run build -- --base=/f1/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
