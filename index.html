<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#080f18"/><title>APEX FORMULA</title>
<style>
html,body{margin:0;background:#080f18;color:#eef4fa}#boot-screen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 60% 40%,#172638,#080f18 65%);font:14px/1.7 system-ui,sans-serif;transition:opacity .3s ease;overflow:hidden}#boot-screen::before{content:'';position:absolute;width:70vw;height:1px;top:25%;left:45%;background:linear-gradient(90deg,transparent,#ff795f70,transparent);transform:rotate(-30deg)}.boot-content{width:min(340px,80vw);position:relative}.boot-brand{display:flex;align-items:center;gap:15px;font-size:28px;font-weight:800;letter-spacing:3px}.boot-brand svg{width:42px;height:48px;color:#ff795f}.boot-brand small{display:block;font-size:12px;font-weight:400;letter-spacing:7px;margin-top:1px;color:#acbdcb}#boot-label{margin:30px 0 12px;color:#b8c9d8;font-size:13px;min-height:24px}.boot-content progress{width:100%;height:3px;display:block;appearance:none;border:0;background:#ffffff14;accent-color:#ff795f}.boot-content progress::-webkit-progress-bar{background:#ffffff14}.boot-content progress::-webkit-progress-value{background:#ff795f;transition:width .25s}.boot-content progress::-moz-progress-bar{background:#ff795f}.boot-actions{display:flex;justify-content:space-between;gap:20px;margin-top:20px}.boot-actions a,.boot-actions button{color:#c6d4df;font:12px system-ui,sans-serif;background:none;border:0;padding:10px 0;text-decoration:none;cursor:pointer}.boot-actions [hidden]{display:none}.boot-actions :focus-visible{outline:2px solid #ffb19d;outline-offset:4px}#boot-screen.is-finished{opacity:0;pointer-events:none}@media(prefers-reduced-motion:reduce){#boot-screen,.boot-content progress::-webkit-progress-value{transition:none}}
</style>
<script>
window.addEventListener('error',function(event){
 if(!(event.target instanceof HTMLScriptElement)||!event.target.src)return;
 function show(){var label=document.getElementById('boot-label'),retry=document.getElementById('boot-retry');if(label)label.textContent='화면을 불러오지 못했습니다. 연결을 확인하고 다시 시도해주세요.';if(retry)retry.hidden=false;}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',show,{once:true});else show();
},true);
</script></head><body><div id="boot-screen" role="status" aria-live="polite"><div class="boot-content"><div class="boot-brand"><svg viewBox="0 0 72 72" aria-hidden="true"><path d="M8 62L31 10H48L64 62H48L37 26 22 62Z" fill="currentColor"/><path d="M22 48H58L54 39H26Z" fill="#101c28"/></svg><div>APEX<small>FORMULA</small></div></div><p id="boot-label">게임을 불러오는 중…</p><progress max="4" value="0" aria-label="시작 화면 준비 단계"></progress><div class="boot-actions"><button id="boot-skip" hidden>정적 배경으로 시작</button><a id="boot-retry" href="" hidden>다시 불러오기 ↗</a></div><noscript>이 게임을 실행하려면 JavaScript를 켜주세요.</noscript></div></div><div id="app" inert></div><script type="module" src="/src/main.ts"></script></body></html>
