<!doctype html><html lang="ko"><head><meta charset="utf-8"></head><body><div id="viewport"></div><div id="hud"></div><script type="module">
import '../src/style.css';import '../src/ui/RaceTiming.css';import '../src/ui/RacingTheme.css';import {Game} from '../src/game/Game';import {openSettings} from '../src/ui/Settings';import {AcademyHUD} from '../src/ui/AcademyHUD';
localStorage.setItem('apex-graphics-quality','low');document.documentElement.dataset.ersLocked='true';window.requestAnimationFrame=()=>0;let latest,ui;
const g=new Game(document.querySelector('#viewport'),document.querySelector('#hud'),{circuit:'monza',opponentCount:0,totalLaps:3,transmission:'auto',career:{hudMode:'training',sample:()=>{},exit:()=>{},reset:()=>{},tutorial:{lesson:0,update:s=>{latest=s;ui?.update(s)}}}});
ui=new AcademyHUD(document.body,0,{confirm:()=>{},retry:()=>g.retryTutorial(),leave:()=>{}});
window.runAcademyGame=()=>{let throttle=false,brake=false,escape=false;g.input.down=(...keys)=>throttle&&keys.includes('KeyW')||keys.includes('ShiftLeft');g.input.analog=()=>({throttle:0,brake:brake?1:0,steer:brake?1:0});g.input.consume=code=>escape&&code==='Escape';const real=g.renderer.render.bind(g.renderer);let renders=0;g.renderer.render=()=>{renders++;};g.mirror.render=()=>{};
const text=[],ctx=g.cockpit.display.getContext('2d'),fill=ctx.fillText.bind(ctx);ctx.fillText=(s,...args)=>{text.push(String(s));fill(s,...args);};const step=()=>g.frame(g.previous+1000/60);
throttle=true;for(let i=0;i<20;i++)step();const frozen=g.vehicle.position.clone(),time=g.race.elapsed;for(let i=0;i<20;i++)step();const hold={phase:latest.phase,motion:g.vehicle.position.distanceTo(frozen),time:g.race.elapsed-time,boosting:g.vehicle.boosting,energy:g.vehicle.boost};escape=true;step();escape=false;const waitingPause={paused:g.paused,menu:!document.querySelector('#pause-menu').hidden,cue:getComputedStyle(document.querySelector('.academy-input-cue')).visibility};escape=true;step();escape=false;const resumedCue=getComputedStyle(document.querySelector('.academy-input-cue')).visibility;throttle=false;step();throttle=true;for(let i=0;i<1200&&latest.phase!=='success';i++)step();
const resultOpen=document.querySelector('.academy-result').open;const phase=latest.phase,speed=g.vehicle.kmh,position=g.vehicle.position.clone(),before=renders;throttle=false;brake=true;escape=true;for(let i=0;i<30;i++)step();const success={resultOpen,phase,speed,motion:g.vehicle.position.distanceTo(position),renders:renders-before,paused:g.paused,changing:g.changingCircuit,ersLabels:text.filter(s=>s.includes('ERS')),ersEnabled:g.vehicle.ersEnabled};real(g.scene,g.cockpit.camera);ctx.fillText=fill;g.retryTutorial();const restarted={phase:g.academy.phase,energy:g.vehicle.boost};g.academy.phase='failed';step();const failed={paused:g.paused,dialog:document.querySelector('.academy-result').open,focused:document.activeElement.id};g.endCareerSession();ui.dispose();return {hold,waitingPause,resumedCue,success,restarted,failed};};
window.checkHiddenEnergySettings=()=>{document.documentElement.dataset.academySession='true';void openSettings();const tutorial={help:document.querySelector('.controls-list').textContent,disabled:document.querySelector('#setting-transmission').disabled};document.querySelector('.settings-dialog').close();delete document.documentElement.dataset.academySession;delete document.documentElement.dataset.ersLocked;void openSettings();const normal={help:document.querySelector('.controls-list').textContent,disabled:document.querySelector('#setting-transmission').disabled};document.querySelector('.settings-dialog').close();return {tutorial,normal};};
</script></body></html>
