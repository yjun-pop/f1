<!doctype html><html lang="ko"><head><meta charset="utf-8"></head><body><div id="viewport"></div><div id="hud"></div><script type="module">
import '../src/style.css';import '../src/ui/RaceTiming.css';import '../src/ui/RacingTheme.css';import {Game} from '../src/game/Game';import {openSettings} from '../src/ui/Settings';
localStorage.setItem('apex-graphics-quality','low');document.documentElement.dataset.ersLocked='true';window.requestAnimationFrame=()=>0;let latest;
const g=new Game(document.querySelector('#viewport'),document.querySelector('#hud'),{circuit:'monza',opponentCount:0,totalLaps:3,transmission:'auto',career:{hudMode:'training',sample:()=>{},exit:()=>{},reset:()=>{},tutorial:{lesson:0,update:s=>latest=s}}});
window.runAcademyGame=()=>{let throttle=false,brake=false,escape=false;g.input.down=(...keys)=>throttle&&keys.includes('KeyW')||keys.includes('ShiftLeft');g.input.analog=()=>({throttle:0,brake:brake?1:0,steer:brake?1:0});g.input.consume=code=>escape&&code==='Escape';const real=g.renderer.render.bind(g.renderer);let renders=0;g.renderer.render=()=>{renders++;};g.mirror.render=()=>{};
const text=[],ctx=g.cockpit.display.getContext('2d'),fill=ctx.fillText.bind(ctx);ctx.fillText=(s,...args)=>{text.push(String(s));fill(s,...args);};const step=()=>g.frame(g.previous+1000/60);
throttle=true;for(let i=0;i<20;i++)step();const frozen=g.vehicle.position.clone(),time=g.race.elapsed;for(let i=0;i<20;i++)step();const hold={phase:latest.phase,motion:g.vehicle.position.distanceTo(frozen),time:g.race.elapsed-time,boosting:g.vehicle.boosting,energy:g.vehicle.boost};throttle=false;step();throttle=true;for(let i=0;i<1200&&latest.phase!=='success';i++)step();
const phase=latest.phase,speed=g.vehicle.kmh,position=g.vehicle.position.clone(),before=renders;throttle=false;brake=true;escape=true;for(let i=0;i<30;i++)step();const success={phase,speed,motion:g.vehicle.position.distanceTo(position),renders:renders-before,paused:g.paused,changing:g.changingCircuit,ersLabels:text.filter(s=>s.includes('ERS')),ersEnabled:g.vehicle.ersEnabled};real(g.scene,g.cockpit.camera);ctx.fillText=fill;g.retryTutorial();const restarted={phase:g.academy.phase,energy:g.vehicle.boost};g.endCareerSession();return {hold,success,restarted};};
window.checkHiddenEnergySettings=()=>{void openSettings();return Array.from(document.querySelectorAll('.controls-list dt')).map(e=>e.textContent);};
</script></body></html>
