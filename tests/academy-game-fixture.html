<!doctype html><html lang="ko"><head><meta charset="utf-8"></head><body><div id="viewport"></div><div id="hud"></div><script type="module">
import '../src/style.css';import '../src/career/Screen.css';import '../src/ui/RaceTiming.css';import '../src/ui/RacingTheme.css';import {Game} from '../src/game/Game';import {openSettings} from '../src/ui/Settings';import {AcademyHUD} from '../src/ui/AcademyHUD';
localStorage.setItem('apex-graphics-quality','low');localStorage.setItem('apex-circuit','spa');document.documentElement.dataset.ersLocked='true';window.requestAnimationFrame=()=>0;let latest,ui;
const g=new Game(document.querySelector('#viewport'),document.querySelector('#hud'),{circuit:'monza',opponentCount:0,totalLaps:3,transmission:'auto',career:{hudMode:'training',sample:()=>{},exit:()=>{},reset:()=>{},tutorial:{lesson:0,update:s=>{latest=s;ui?.update(s)}}}});
ui=new AcademyHUD(document.body,0,{confirm:()=>{},retry:()=>g.retryTutorial(),leave:()=>{}});
const map=document.querySelector('.mapbox'),stack=document.createElement('div');stack.className='hud-map-stack';map.before(stack);stack.append(map,ui.overlay);
window.previewAcademy=()=>{g.frame(g.previous+1000/60);return {name:g.track.name,training:g.track.circuit.training,savedCircuit:localStorage.getItem('apex-circuit')}};
window.runAcademyGame=()=>{g.retryTutorial();let throttle=false,brake=false,escape=false;g.input.down=(...keys)=>throttle&&keys.includes('KeyW')||keys.includes('ShiftLeft');g.input.analog=()=>({throttle:0,brake:brake?1:0,steer:brake?1:0});g.input.consume=code=>escape&&code==='Escape';const real=g.renderer.render.bind(g.renderer);let renders=0;g.renderer.render=()=>{renders++;};g.mirror.render=()=>{};
const text=[],ctx=g.cockpit.display.getContext('2d'),fill=ctx.fillText.bind(ctx);ctx.fillText=(s,...args)=>{text.push(String(s));fill(s,...args);};const step=()=>g.frame(g.previous+1000/60);
throttle=true;for(let i=0;i<20;i++)step();const frozen=g.vehicle.position.clone(),time=g.race.elapsed;for(let i=0;i<20;i++)step();const hold={phase:latest.phase,motion:g.vehicle.position.distanceTo(frozen),time:g.race.elapsed-time,boosting:g.vehicle.boosting,energy:g.vehicle.boost};escape=true;step();escape=false;const waitingPause={paused:g.paused,menu:!document.querySelector('#pause-menu').hidden,cue:getComputedStyle(document.querySelector('.academy-input-cue')).visibility};escape=true;step();escape=false;const resumedCue=getComputedStyle(document.querySelector('.academy-input-cue')).visibility;throttle=false;step();throttle=true;for(let i=0;i<1200&&latest.phase!=='success';i++)step();
const resultOpen=document.querySelector('.academy-result').open;const phase=latest.phase,speed=g.vehicle.kmh,position=g.vehicle.position.clone(),before=renders;throttle=false;brake=true;escape=true;for(let i=0;i<30;i++)step();const success={resultOpen,phase,speed,motion:g.vehicle.position.distanceTo(position),renders:renders-before,paused:g.paused,changing:g.changingCircuit,ersLabels:text.filter(s=>s.includes('ERS')),ersEnabled:g.vehicle.ersEnabled};real(g.scene,g.cockpit.camera);ctx.fillText=fill;g.retryTutorial();const restarted={phase:g.academy.phase,energy:g.vehicle.boost};g.academy.phase='failed';step();const failed={paused:g.paused,dialog:document.querySelector('.academy-result').open,focused:document.activeElement.id};g.endCareerSession();ui.dispose();return {hold,waitingPause,resumedCue,success,restarted,failed};};
window.checkHiddenEnergySettings=()=>{document.documentElement.dataset.academySession='true';void openSettings();const tutorial={help:document.querySelector('.controls-list').textContent,disabled:document.querySelector('#setting-transmission').disabled};document.querySelector('.settings-dialog').close();delete document.documentElement.dataset.academySession;delete document.documentElement.dataset.ersLocked;void openSettings();const normal={help:document.querySelector('.controls-list').textContent,disabled:document.querySelector('#setting-transmission').disabled};document.querySelector('.settings-dialog').close();return {tutorial,normal};};
</script></body></html>
<script type="module">
import {Game} from '../src/game/Game';
window.checkAssessmentGame=(opponents=0,preview=false)=>{
 localStorage.setItem('apex-best-academy tech-v3','72');
 document.querySelector('#viewport').replaceChildren();delete document.querySelector('#hud').dataset.tutorial;
 const q=new Game(document.querySelector('#viewport'),document.querySelector('#hud'),{circuit:'monza',opponentCount:opponents,totalLaps:1,flyingStart:false,autoStart:true,career:{hudMode:opponents?'traffic':'assessment',guidance:true,sample:()=>{},exit:()=>{},reset:()=>{}}});
 const show=q.renderer.render.bind(q.renderer);q.renderer.render=()=>{};q.mirror.render=()=>{};q.input.down=(...keys)=>keys.includes('KeyW');q.input.consume=()=>false;q.input.analog=()=>({throttle:0,brake:0,steer:0});
 const cars=[q.vehicle,...q.race.opponents.map(o=>o.car)],poses=cars.map(c=>c.position.clone());const initialSpeeds=cars.map(c=>c.speed);
 for(let i=0;i<120;i++)q.frame(q.previous+1000/60);
 const lamps=q.track.startBulbs.length,litAtHold=q.track.startBulbs.filter(m=>m.emissiveIntensity>1).length;const stoppedForLights=cars.every((c,i)=>c.position.distanceTo(poses[i])===0&&c.speed===0)&&q.race.elapsed===0;q.input.down=()=>false;
 if(preview){show(q.scene,q.cockpit.camera);q.endCareerSession();return {lamps,litAtHold,stoppedForLights};}
 let ticks=0;while(q.race.elapsed===0&&ticks++<2400)q.frame(q.previous+1000/60);
 const speedAtGo=q.vehicle.speed;show(q.scene,q.cockpit.camera);const aiStart=q.race.opponents.map(o=>o.car.distance);
 if(opponents)for(let i=0;i<1200;i++)q.frame(q.previous+1000/60);
 const ai=q.race.opponents.map((o,i)=>({moved:(o.car.distance-aiStart[i])*q.track.length,progress:o.car.progress,offRoad:o.car.offRoad,speed:o.car.speed}));
 const result={name:q.track.name,corners:q.track.cornerCount,sections:q.track.sections.length,started:q.race.elapsed>0,savedCircuit:localStorage.getItem('apex-circuit'),bestAtStart:q.race.bestAtStart,legacyBest:localStorage.getItem('apex-best-academy tech-v3'),initialSpeeds,stoppedForLights,lamps,litAtHold,lightsAtGo:q.track.startBulbs.filter(m=>m.emissiveIntensity>1).length,speedAtGo,flying:q.race.flyingStart,ai,firstCorner:q.track.sections[0].progress};q.endCareerSession();return result;
};
</script>
<script type="module">
import {Game} from '../src/game/Game';
import {AcademyHUD} from '../src/ui/AcademyHUD';
window.previewHandlingGame=()=>{
 const viewport=document.querySelector('#viewport'),hud=document.querySelector('#hud');viewport.replaceChildren();let coach,latest;
 const q=new Game(viewport,hud,{opponentCount:0,transmission:'auto',career:{hudMode:'training',sample:()=>{},exit:()=>{},reset:()=>{},tutorial:{lesson:2,update:s=>{latest=s;coach?.update(s)}}}});
 coach=new AcademyHUD(document.body,2,{confirm:()=>{},retry:()=>{},leave:()=>{}});
 const map=hud.querySelector('.mapbox'),stack=document.createElement('div');stack.className='hud-map-stack';map.before(stack);stack.append(map,coach.overlay);
 let gas=0;q.input.down=()=>false;q.input.consume=()=>false;q.input.analog=()=>({throttle:gas,brake:0,steer:0});q.frame(q.previous+1000/60);gas=1;q.frame(q.previous+1000/60);gas=0;q.frame(q.previous+1000/60);
 const box=coach.overlay.getBoundingClientRect(),cue=document.querySelector('.academy-driving-cue').getBoundingClientRect();
 const result={name:q.track.name,phase:latest.phase,action:latest.action,overlayFits:box.right<=innerWidth&&box.bottom<=innerHeight,cueFits:cue.left>=0&&cue.right<=innerWidth&&cue.bottom<=innerHeight};q.endCareerSession();return result;
};
</script>
