<!doctype html><html lang="ko"><head><meta charset="utf-8"></head><body><div id="viewport"></div><div id="hud"></div><script type="module">
import '../src/style.css';import * as THREE from 'three';import {Game} from '../src/game/Game';import {carIdentity} from '../src/game/CarLivery';import {teammateAppearance} from '../src/career/Teammate';
localStorage.setItem('apex-graphics-quality','low');localStorage.setItem('apex-transmission-mode','auto');window.requestAnimationFrame=()=>0;
const save={phase:'season',team:'vector',year:1,round:0,driver:{number:27}},g=new Game(document.querySelector('#viewport'),document.querySelector('#hud'),{circuit:'monza',appearance:carIdentity('vector',27),teammate:teammateAppearance(save),opponentCount:5,totalLaps:3,autoStart:true});
const mate=g.race.opponents.find(o=>o.id==='ai:solar'),normal=g.race.opponents.find(o=>o.id==='ai:nova');g.input.down=()=>false;g.input.consume=()=>false;g.input.analog=()=>undefined;g.frame(g.previous+1000/60);
window.inspectTeammate=()=>{const identity=structuredClone(mate.car.group.userData.livery);mate.car.setPresentation(200,'low');const far=mate.car.farModel.children[0].material.color.getHex();mate.car.setPresentation(0,'low');g.restart();return {identity,afterReset:mate.car.group.userData.livery,player:g.vehicle.group.userData.livery,ids:g.race.opponents.map(o=>o.id),normal:normal.car.group.userData.livery??null,far,grip:mate.car.gripScale,power:mate.car.powerScale,footer:!!document.querySelector('#hud footer')};};
window.previewTeammate=()=>{g.paused=true;document.querySelector('#hud').hidden=true;const p=g.vehicle.position.clone(),forward=g.track.tangent(g.vehicle.progress),normal=g.track.normal(g.vehicle.progress);mate.car.position.copy(p).addScaledVector(forward,5).addScaledVector(normal,4);mate.car.sync();
const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,2000);camera.position.copy(p).addScaledVector(forward,9).addScaledVector(normal,13).add(new THREE.Vector3(0,8,0));camera.lookAt(p.clone().addScaledVector(forward,2.5));const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.querySelector('#viewport').replaceChildren(renderer.domElement);renderer.render(g.scene,camera);return true;};
window.disposeTeam=()=>{let disposed=0;const textures=new Set();for(const car of[g.vehicle,mate.car])car.group.traverse(o=>{if(o.material?.map?.userData.carAppearance)textures.add(o.material.map);});for(const texture of textures)texture.addEventListener('dispose',()=>disposed++);g.endCareerSession();g.endCareerSession();return {textures:textures.size,disposed};};
</script></body></html>
