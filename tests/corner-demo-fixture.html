<!doctype html><html><body style="margin:0;background:#101923"><div id="demo" style="width:640px;height:210px"></div><script type="module">
import {CornerDemo} from '../src/ui/CornerDemo';window.demo=new CornerDemo(document.querySelector('#demo'),'monza');cancelAnimationFrame(demo.raf);window.requestAnimationFrame=()=>0;
window.verifyDemo=()=>{demo.renderer.render=()=>{};let plansValid=true;for(let tip=0;tip<4;tip++){demo.select('monza',tip);let previous=demo.speedPlan.speed(0);for(let m=1;m<=demo.span;m++){const next=demo.speedPlan.speed(m);if(m<=demo.speedPlan.exitDistance?next>previous+1e-6:next<previous-1e-6)plansValid=false;previous=next;}}demo.select('monza',0);let minimum=1,difference=0;let priorDistance=0,priorPhase='',phaseSwitches=0,maxSwitches=0;demo.last=1000;for(let i=1;i<=1000;i++){demo.frame(1000+i*1000/60);if(demo.metres<priorDistance){maxSwitches=Math.max(maxSwitches,phaseSwitches);phaseSwitches=0;priorPhase='';}if(demo.phase){if(priorPhase&&demo.phase!==priorPhase)phaseSwitches++;priorPhase=demo.phase;}priorDistance=demo.metres;const p=(demo.from+demo.metres)/demo.track.length,t=demo.pathPoint(p+2/demo.track.length).sub(demo.pathPoint(p-2/demo.track.length)).normalize();minimum=Math.min(minimum,t.x*Math.sin(demo.car.rotation.y)+t.z*Math.cos(demo.car.rotation.y));difference=Math.max(difference,Math.abs(Math.atan2(Math.sin(demo.car.rotation.y-demo.cameraHeading),Math.cos(demo.car.rotation.y-demo.cameraHeading))));}const before=demo.metres;demo.paused=true;demo.frame(demo.last+16);const paused=demo.metres===before;demo.dispose();return {plansValid,minimum,difference,phaseSwitches:Math.max(maxSwitches,phaseSwitches),paused,disposed:!document.querySelector('canvas')};};
</script></body></html>
