<!doctype html><html><body style="margin:0;background:#101923"><div id="demo" style="width:640px;height:210px"></div><script type="module">
import {CornerDemo} from '../src/ui/CornerDemo';window.demo=new CornerDemo(document.querySelector('#demo'),'monza');cancelAnimationFrame(demo.raf);window.requestAnimationFrame=()=>0;
window.verifyDemo=()=>{demo.renderer.render=()=>{};let minimum=1,difference=0;demo.last=1000;for(let i=1;i<=1000;i++){demo.frame(1000+i*1000/60);const p=(demo.from+demo.metres)/demo.track.length,t=demo.planner.point(p+2/demo.track.length).sub(demo.planner.point(p-2/demo.track.length)).normalize();minimum=Math.min(minimum,t.x*Math.sin(demo.car.rotation.y)+t.z*Math.cos(demo.car.rotation.y));difference=Math.max(difference,Math.abs(Math.atan2(Math.sin(demo.car.rotation.y-demo.cameraHeading),Math.cos(demo.car.rotation.y-demo.cameraHeading))));}const before=demo.metres;demo.paused=true;demo.frame(demo.last+16);const paused=demo.metres===before;demo.dispose();return {minimum,difference,paused,disposed:!document.querySelector('canvas')};};
</script></body></html>
